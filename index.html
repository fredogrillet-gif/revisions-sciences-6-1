<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Station Météo – Révisions 6e Physique-Chimie</title>
<style>
:root{--b:#fbfaf4;--t:#16263a;--c:#1f6fd1;--s:#e6eefb;--h:#ffe46b}
@media(prefers-color-scheme:dark){:root{--b:#101b2a;--t:#eaf0f7;--c:#6aa8ff;--s:#1c2e46;--h:#8a7a1d}}
body{margin:0;background:var(--b);color:var(--t);font:17px/1.55 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:auto;padding:16px}
h1,h2,button,select,input,.top,.ch{font-family:"Trebuchet MS",system-ui,sans-serif}
h1{font-size:28px;line-height:1.2;background:linear-gradient(transparent 62%,var(--h) 62%);display:inline}
h2{font-size:15px;margin:18px 0 4px;color:var(--c)}
button{font-size:16px;padding:10px 16px;border-radius:10px;border:2px solid var(--c);background:var(--s);color:var(--t);cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,select:focus-visible,input:focus-visible,.ch:focus-visible{outline:3px solid var(--h);outline-offset:2px}
button.g{background:var(--c);color:#fff;font-weight:700}
.o{display:block;width:100%;text-align:left}
.on{background:var(--c)!important;color:#fff!important}
.top{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:var(--s);border-radius:4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.q{font-weight:700;font-size:19px}
.card{background:var(--s);padding:4px 16px;border-left:6px solid var(--c)}
select,input{font-size:16px;padding:6px;border-radius:8px;border:2px solid var(--c);background:var(--b);color:var(--t)}
.r{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.r span{min-width:160px}
.pool,.zz{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.ch{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;border:2px solid var(--c);border-radius:10px;background:var(--s);cursor:pointer;font-size:32px}
.ch small{font-size:12px}
.ch.t{font-size:15px;flex-direction:row}
.zs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.z{border:2px dashed var(--c);border-radius:12px;padding:8px}
.z b{font-size:14px;font-family:"Trebuchet MS",sans-serif}
.big{font-size:30px;font-weight:700}
#fb{min-height:1.5em}
body{background:radial-gradient(circle at 0 0,var(--h) 0,transparent 22%),radial-gradient(circle at 100% 30%,var(--s) 0,transparent 45%),var(--b);min-height:100vh}
.hero{font-size:68px;text-align:center;line-height:1.2;animation:bob 2.4s ease-in-out infinite}
.panel{background:var(--b);border:3px solid var(--c);border-radius:18px;padding:6px 18px 14px;box-shadow:6px 6px 0 var(--c);margin:8px 6px 14px 0}
.panel .hero{font-size:54px}
.o,.lv{transition:transform .12s}.o:hover,.lv:hover{transform:translateY(-2px)}
.lv{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 18px;font-size:18px}.lv small{display:block;font-weight:400;font-size:14px}
.bar{height:12px;border:2px solid var(--c)}.bar i{position:relative;transition:width .5s}.bar i::after{content:'🚀';position:absolute;right:-10px;top:-17px;font-size:22px}
.bar2{display:block;height:12px;background:var(--s);border-radius:6px}.bar2 i{display:block;height:100%;background:var(--c);border-radius:6px}
.ok{animation:pop .5s}.ko{animation:sh .4s}
.cf{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes bob{50%{transform:translateY(-8px)}}@keyframes pop{40%{transform:scale(1.03);box-shadow:0 0 0 8px var(--h)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),app=$('#app'),KEY='rev6e';
let L=[],k=0,pts=0,sc={},tr=0,chk,done,iv=-1,lv=2,st=0,hu=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({k,pts,sc,lv}))}catch(e){}},
load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const OKM=["Génial !","Bravo !","Excellent !","Tu gères !","Top !","Quel talent !"],KOM=["Pas tout à fait…","Presque !","Oups !"],
LV={1:[1,2],2:[1,2,3],3:[2,3]},LN={1:"🟢 Explorateur",2:"🟡 Pilote",3:"🔴 Expert"},rnd=a=>a[Math.floor(Math.random()*a.length)];
function build(){L=[];S.forEach(s=>{let f=1;s.i.filter(x=>LV[lv].includes(x.l||2)).forEach(x=>{L.push({...x,s,first:f});f=0})})}
function boom(n){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','⭐','✨','🎈','🚀'][i%5];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),2500)}}
function home(){const v=load();document.body.style.removeProperty('--c');app.innerHTML=`<div class="hero">🌦️🚀🧪</div><h1>Mission Station Météo</h1><p>Révisions de physique-chimie en 6e : météo et grandeurs, trajectoires, vitesse. Choisis ton niveau :</p>${[1,2,3].map(l=>`<button class="lv" onclick="start(0,${l})"><b>${LN[l]}</b><small>${["Défis accessibles, indices gratuits","Tous les défis, indices à moitié de points","Défis difficiles, sans indice"][l-1]}</small></button>`).join('')}${v&&v.k>0?`<p><button onclick="start(1)">Reprendre ma partie (${LN[v.lv||2]}, défi ${v.k+1})</button></p>`:''}<p><small>Sur téléphone : touche un objet puis touche sa case. Enchaîne les bonnes réponses pour garder ta série 🔥</small></p>`}
function start(r,l){if(r){const v=load();lv=v.lv||2;build();k=v.k;pts=v.pts;sc=v.sc}else{lv=l;build();k=0;pts=0;sc={}}st=0;iv=-1;step()}
function step(){if(k>=L.length)return end();const x=L[k];document.body.style.setProperty('--c',x.s.c);if(x.first&&iv!=k){iv=k;app.innerHTML=`<div class="hero">${x.s.g}</div><h1>${x.s.n}</h1><h2>Je retiens</h2><div class="card"><p>${x.s.r}</p></div><p><button class="g" onclick="step()">C'est parti !</button></p>`;return}show(x)}
function show(x){tr=0;done=0;hu=0;app.innerHTML=`<div class="top"><span>${x.s.g} ${x.s.n}</span><span>🔥 ${st} · ⭐ ${pts}</span></div><div class="bar"><i style="width:${Math.max(4,k/L.length*100)}%"></i></div><h2>Défi ${k+1} sur ${L.length}</h2><div class="panel" id="pn">${x.i?`<div class="hero">${x.i}</div>`:''}<p class="q">${x.q}</p><div id="w"></div></div><p id="fb"></p><button class="g" id="ok" onclick="val()">Valider</button>${lv<3&&(x.h||x.t=='n'&&x.e)?'<button id="hb" onclick="hint()">💡 Indice</button>':''}`;chk=widget(x,$('#w'))}
function hint(){const x=L[k];$('#fb').innerHTML='💡 '+(x.h||x.e);hu=lv>1?1:0}
const rev=x=>({q:()=>x.o[x.a],n:()=>x.a+' '+x.u,m:()=>x.p.map(p=>p.join(' → ')).join(' ; '),f:()=>x.a.join(' · '),s:()=>x.a.join(' ➜ '),d:()=>x.it.map(i=>i[0]+' '+x.z[i[2]]).join(' ; ')})[x.t]();
function fin(){done=1;$('#w').style.pointerEvents='none';const h=$('#hb');h&&h.remove();$('#ok').textContent=k+1<L.length?'Suivant ➜':'Voir mes résultats'}
function val(){const x=L[k],fb=$('#fb'),pn=$('#pn');if(done){k++;save();return step()}const r=chk();if(r===null){fb.textContent='Complète ta réponse avant de valider.';return}
pn.classList.remove('ok','ko');void pn.offsetWidth;
if(r){let p=tr?5:10;if(hu)p=Math.ceil(p/2);pts+=p;st++;sc[x.s.n]=(sc[x.s.n]||0)+p;pn.classList.add('ok');boom(st>2?32:14);fb.innerHTML=`<b>${rnd(OKM)}</b> +${p} points ${st>2?'🔥 série de '+st:''} ${x.e||x.h||''}`;fin()}
else{st=0;pn.classList.add('ko');if(!tr++){fb.textContent='❌ '+rnd(KOM)+' Relis bien et réessaie.'}else{fb.innerHTML='❌ La réponse était : <b>'+rev(x)+'</b>. '+(x.e||x.h||'');fin()}}}
function widget(x,b){const t=x.t;
if(t=='q'){let s=-1;b.innerHTML=sh(x.o.map((o,i)=>i)).map(i=>`<button class="o" data-i="${i}">${x.o[i]}</button>`).join('');b.onclick=e=>{const c=e.target.closest('.o');if(c){s=+c.dataset.i;[...b.children].forEach(y=>y.classList.toggle('on',y==c))}};return()=>s<0?null:s==x.a}
if(t=='n'){b.innerHTML=`<input id="in" inputmode="decimal" autocomplete="off" size="8" aria-label="Ta réponse"> <b>${x.u}</b>`;const i=$('#in');i.onkeydown=e=>e.key=='Enter'&&val();i.focus();return()=>{const v=parseFloat(i.value.replace(',','.'));return isNaN(v)?null:Math.abs(v-x.a)<1e-6}}
if(t=='m'){const R=sh([...new Set(x.p.map(p=>p[1]))]);b.innerHTML=x.p.map(p=>`<div class="r"><span>${p[0]}</span><select><option value="">?</option>${R.map(r=>`<option>${r}</option>`).join('')}</select></div>`).join('');return()=>{const Z=[...b.querySelectorAll('select')];return Z.some(s=>!s.value)?null:Z.every((s,i)=>s.value==x.p[i][1])}}
if(t=='f'){const o=sh(x.o);b.innerHTML='<p>'+x.tx.replace(/___/g,()=>`<select><option value="">?</option>${o.map(v=>`<option>${v}</option>`).join('')}</select>`)+'</p>';return()=>{const Z=[...b.querySelectorAll('select')];return Z.some(s=>!s.value)?null:Z.every((s,i)=>s.value==x.a[i])}}
if(t=='s'){b.innerHTML=`<div class="pool">${sh(x.a).map(a=>`<span class="ch t" tabindex="0">${a}</span>`).join('')}</div><p><b>Ton ordre :</b></p><div class="pool sq" style="flex-direction:column"></div>`;const P=b.firstChild,Q2=b.lastChild;const mv=e=>{const c=e.target.closest('.ch');if(c)(c.parentNode==P?Q2:P).append(c)};b.onclick=mv;b.onkeydown=e=>e.key=='Enter'&&mv(e);return()=>P.children.length?null:[...Q2.children].every((c,i)=>c.textContent==x.a[i])}
if(t=='d'){let sel=null,dr=null;b.innerHTML=`<div class="pool">${sh(x.it).map(i=>`<span class="ch" draggable="true" data-z="${i[2]}">${i[0]}<small>${i[1]}</small></span>`).join('')}</div><div class="zs">${x.z.map(z=>`<div class="z"><b>${z}</b><div class="zz"></div></div>`).join('')}</div>`;const P=b.firstChild;
b.onclick=e=>{const c=e.target.closest('.ch');if(c){if(c.parentNode.classList.contains('zz')){P.append(c);return}sel&&sel.classList.remove('on');sel=c;c.classList.add('on');return}const z=e.target.closest('.z');if(z&&sel){z.querySelector('.zz').append(sel);sel.classList.remove('on');sel=null}};
b.ondragstart=e=>{dr=e.target.closest('.ch')};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{const z=e.target.closest('.z');if(z&&dr){z.querySelector('.zz').append(dr);dr=null}};
return()=>P.children.length?null:[...b.querySelectorAll('.z')].every((z,i)=>[...z.querySelectorAll('.ch')].every(c=>+c.dataset.z==i))}}
function end(){const m=L.length*10,p=Math.round(pts/m*100),n=p>=90?3:p>=70?2:p>=50?1:0;boom(44);app.innerHTML=`<div class="hero">${['🧗','🥉','🥈','🏆'][n]}</div><h1>Mission terminée !</h1><p class="big">${pts} / ${m} points</p><p class="big">${'⭐'.repeat(n)||'💪'}</p><p>${LN[lv]} : ${p} %. ${p>=90?"Expert·e en météo et en mouvement !":p>=70?"Très bien, tu maîtrises l'essentiel.":p>=50?"C'est correct. Revois les points où tu as hésité.":"Relis tes fiches PC 1, PC 2 et PC 3, puis recommence."}</p>${S.map(t=>{const T=L.filter(x=>x.s==t).length*10,v=T?Math.round((sc[t.n]||0)/T*100):0;return`<p>${t.g} ${t.n} : <b>${v} %</b><span class="bar2"><i style="width:${v}%"></i></span></p>`}).join('')}<button class="g" onclick="home()">Rejouer</button>`;try{localStorage.removeItem(KEY)}catch(e){}}
home();
</script>
</body>
</html>
